<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremiumHub Admin - Add Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .emoji-picker {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
        }

        .emoji-item {
            width: 40px;
            height: 40px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .emoji-item:hover {
            border-color: #6366f1;
            background: #f3f4f6;
            transform: scale(1.1);
        }

        .emoji-item.selected {
            border-color: #6366f1;
            background: #6366f1;
        }

        .selected-emoji {
            font-size: 2rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-primary:hover {
            background: #5558e3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .products-list {
            margin-top: 3rem;
            border-top: 2px solid #e5e7eb;
            padding-top: 2rem;
        }

        .products-list h2 {
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .product-item {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #6366f1;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.25rem;
        }

        .product-details {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .product-icon {
            font-size: 2rem;
            margin-right: 1rem;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-message {
            text-align: center;
            color: #9ca3af;
            padding: 2rem;
            background: #f9fafb;
            border-radius: 5px;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1rem;
            }

            .emoji-picker {
                grid-template-columns: repeat(6, 1fr);
            }

            .buttons {
                flex-direction: column;
            }

            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-icon {
                margin-right: 0;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link" style="color: white; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Back to Store
            </a>
            <h1><i class="fas fa-crown"></i> PremiumHub Admin</h1>
            <p>Add and manage your products easily</p>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage">
                ✅ Product added successfully!
            </div>
            <div class="error-message" id="errorMessage">
                ❌ Please fill in all fields correctly
            </div>

            <form id="addProductForm">
                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" placeholder="e.g., iPhone 15 Pro" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Description *</label>
                    <textarea id="productDescription" placeholder="e.g., Latest Apple smartphone with A17 Pro chip" required></textarea>
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₹) *</label>
                    <input type="number" id="productPrice" placeholder="e.g., 129999" min="0" step="1" required>
                    <small style="color: #9ca3af; margin-top: 0.25rem; display: block;">Enter price in rupees (e.g., 1299 for ₹1299)</small>
                </div>

                <div class="form-group">
                    <label>Product Icon/Emoji *</label>
                    <div class="emoji-picker" id="emojiPicker">
                        <span class="emoji-item" data-emoji="📱">📱</span>
                        <span class="emoji-item" data-emoji="💻">💻</span>
                        <span class="emoji-item" data-emoji="⌚">⌚</span>
                        <span class="emoji-item" data-emoji="🎧">🎧</span>
                        <span class="emoji-item" data-emoji="📷">📷</span>
                        <span class="emoji-item" data-emoji="⌨️">⌨️</span>
                        <span class="emoji-item" data-emoji="🖱️">🖱️</span>
                        <span class="emoji-item" data-emoji="🔌">🔌</span>
                        <span class="emoji-item" data-emoji="📹">📹</span>
                        <span class="emoji-item" data-emoji="🖥️">🖥️</span>
                        <span class="emoji-item" data-emoji="📦">📦</span>
                        <span class="emoji-item" data-emoji="👕">👕</span>
                        <span class="emoji-item" data-emoji="👟">👟</span>
                        <span class="emoji-item" data-emoji="👜">👜</span>
                        <span class="emoji-item" data-emoji="📚">📚</span>
                        <span class="emoji-item" data-emoji="🎮">🎮</span>
                        <span class="emoji-item" data-emoji="🎵">🎵</span>
                        <span class="emoji-item" data-emoji="💎">💎</span>
                        <span class="emoji-item" data-emoji="🏆">🏆</span>
                        <span class="emoji-item" data-emoji="⚡">⚡</span>
                        <span class="emoji-item" data-emoji="🔥">🔥</span>
                        <span class="emoji-item" data-emoji="✨">✨</span>
                        <span class="emoji-item" data-emoji="🌟">🌟</span>
                        <span class="emoji-item" data-emoji="💰">💰</span>
                    </div>
                    <div class="selected-emoji" id="selectedEmoji" style="display: none;"></div>
                </div>

                <input type="hidden" id="selectedEmojiValue">

                <div class="buttons">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                    <button type="reset" class="btn-secondary">
                        <i class="fas fa-redo"></i> Clear
                    </button>
                </div>
            </form>

            <div class="products-list">
                <h2>📋 Your Products</h2>
                <div id="productsList">
                    <div class="empty-message">
                        <i class="fas fa-inbox"></i>
                        <p>No products yet. Add your first product above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load products from localStorage
        let products = JSON.parse(localStorage.getItem('premiumhub_products')) || [];

        // Emoji picker
        const emojiItems = document.querySelectorAll('.emoji-item');
        const selectedEmojiValue = document.getElementById('selectedEmojiValue');
        const selectedEmojiDisplay = document.getElementById('selectedEmoji');

        emojiItems.forEach(item => {
            item.addEventListener('click', () => {
                // Remove previous selection
                emojiItems.forEach(i => i.classList.remove('selected'));
                
                // Add selection to clicked item
                item.classList.add('selected');
                selectedEmojiValue.value = item.dataset.emoji;
                selectedEmojiDisplay.textContent = item.dataset.emoji;
                selectedEmojiDisplay.style.display = 'block';
            });
        });

        // Form submission
        const form = document.getElementById('addProductForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('productName').value.trim();
            const description = document.getElementById('productDescription').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const emoji = selectedEmojiValue.value;

            // Validation
            if (!name || !description || !price || !emoji) {
                showError();
                return;
            }

            if (price <= 0) {
                showError('Price must be greater than 0');
                return;
            }

            // Create product object
            const newProduct = {
                id: Date.now(),
                name: name,
                description: description,
                price: price * 100, // Convert to paise
                icon: emoji
            };

            // Add to products array
            products.push(newProduct);

            // Save to localStorage
            localStorage.setItem('premiumhub_products', JSON.stringify(products));

            // Show success message
            showSuccess();

            // Reset form
            form.reset();
            emojiItems.forEach(i => i.classList.remove('selected'));
            selectedEmojiValue.value = '';
            selectedEmojiDisplay.style.display = 'none';

            // Refresh products list
            displayProducts();

            // Refresh main website products
            if (window.opener) {
                window.opener.location.reload();
            }
        });

        // Display products
        function displayProducts() {
            const productsList = document.getElementById('productsList');
            
            if (products.length === 0) {
                productsList.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-inbox"></i>
                        <p>No products yet. Add your first product above!</p>
                    </div>
                `;
                return;
            }

            productsList.innerHTML = products.map(product => `
                <div class="product-item">
                    <div style="display: flex; align-items: center; flex: 1;">
                        <div class="product-icon">${product.icon}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-details">
                                ${product.description} | <strong>₹${(product.price / 100).toFixed(2)}</strong>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-delete" onclick="deleteProduct(${product.id})">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            `).join('');
        }

        // Delete product
        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('premiumhub_products', JSON.stringify(products));
                displayProducts();
            }
        }

        // Show success message
        function showSuccess() {
            const message = document.getElementById('successMessage');
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        // Show error message
        function showError(msg = 'Please fill in all fields correctly') {
            const message = document.getElementById('errorMessage');
            message.textContent = '❌ ' + msg;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        // Load products on page load
        displayProducts();
    </script>
</body>
</html>
